name: Scripts
on:
  push:
    branches: [main]
  pull_request:

# The skill's scripts on the three systems an agent may run them on: set up a project, check its storyboard, render stills.
jobs:
  promo-video:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SKILL: skills/promo-video
      PROJECT: ${{ github.workspace }}/../demo
      PYTHONUTF8: '0'  # keep Windows' own default encoding, so a missing encoding="utf-8" fails here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg-full -y --no-progress ;;
          esac
      - run: pip install numpy fonttools
      - run: |
          uv tool install "renoise-kit[all] @ git+https://github.com/renoise-ai/renoise-kit@main"
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: python -m compileall -q "$SKILL/scripts"
      - run: python "$SKILL/scripts/typo_lint.py" "$SKILL/templates/remotion/storyboard.json"
      - run: python "$SKILL/scripts/setup_project.py" "$PROJECT"
      - run: python "$SKILL/scripts/synth_bgm.py" "$PROJECT/public/music/bgm.wav" --seconds 30 --bpm 120 --mood tech
      - run: python "$SKILL/scripts/check_storyboard.py" "$PROJECT/storyboard.json"
      - run: python "$SKILL/scripts/render.py" "$PROJECT" stills
      - run: python -c "import os, sys; assert os.path.getsize(sys.argv[1]) > 0" "$PROJECT/out/stills-sheet.jpg"

  digital-human-koubo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SKILL: skills/digital-human-koubo
      PROJECT: ${{ github.workspace }}/../koubo
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg-full -y --no-progress ;;
          esac
      - run: pip install numpy pillow faster-whisper
      - run: python -m compileall -q "$SKILL/scripts"
      - name: build_tasks
        run: |
          mkdir -p "$PROJECT/gen" && cd "$PROJECT"
          printf '%s' '[{"id":"s1","shot":"full","t":"Hello, today I will show you how to make a talking video from one photo.","lang":"English","lang_code":"en"},{"id":"s2","shot":"pip","t":"First, open Renoise and upload your photo.","lang":"English","lang_code":"en","host":"b"}]' > script.json
          printf '%s' '{"hosts":{"a":{"ref":"material:1","who":"woman","framing":"selfie","ratio":"9:16"},"b":{"ref":"task:2","who":"man","framing":"studio","ratio":"16:9"}}}' > brief.json
          python "$GITHUB_WORKSPACE/$SKILL/scripts/build_tasks.py" script.json tasks.json
          python -c "import json; t = json.load(open('tasks.json', encoding='utf-8')); assert [x['resolution'] for x in t] == ['720p', '480p'] and t[1]['references'][0]['ref'] == 'task:2'"
      - name: assemble and align (listen back with faster-whisper)
        if: runner.os == 'Linux'
        env:
          WHISPER_MODEL: tiny
        run: |
          cd "$PROJECT"
          for i in 1 2; do
            python -c "import json, sys; print(json.load(open('script.json', encoding='utf-8'))[int(sys.argv[1])]['t'])" $((i - 1)) > line.txt
            espeak-ng -f line.txt -w s$i.wav
            ffmpeg -loglevel error -y -f lavfi -i color=c=gray:s=720x1280:r=30 -i s$i.wav -af apad=pad_dur=1 -shortest -c:v libx264 -c:a aac gen/s$i.mp4
          done
          printf '%s' '{"s1":"gen/s1.mp4","s2":"gen/s2.mp4"}' > clips.json
          python "$GITHUB_WORKSPACE/$SKILL/scripts/assemble.py" script.json clips.json --out out.mp4 --lang en
          python "$GITHUB_WORKSPACE/$SKILL/scripts/align.py" script.json --out edit/src/tl.json
          python -c "import json; d = json.load(open('edit/src/tl.json', encoding='utf-8')); assert d['total'] > 3 and len(d['segs']) == 2"
      - run: python "$SKILL/scripts/check_edit.py" "$SKILL/templates/huazi-916/src"
      - run: python "$SKILL/scripts/new_edit.py" huazi-916 "$PROJECT/edit-b"
      - run: python "$SKILL/scripts/check_edit.py" "$PROJECT/edit-b/src"
      - run: test -f "$PROJECT/edit-b/public/sfx/pop.wav" && test -f "$PROJECT/edit-b/public/emoji/manifest.json"

  pixel-breakdown:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SKILL: skills/pixel-breakdown
      PROJECT: ${{ github.workspace }}/../pixel
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg-full -y --no-progress ;;
          esac
      - run: pip install numpy scipy pillow playwright
      - run: python -m playwright install chromium $([ "$RUNNER_OS" = Linux ] && echo --with-deps)
      - run: python -m compileall -q "$SKILL/scripts" "$SKILL/engine"
      - run: python "$SKILL/scripts/doctor.py" --no-asr
      - name: demo project (setup, font download, synthetic clips, voice and alignment)
        run: python "$SKILL/scripts/demo.py" "$PROJECT"
      - name: timeline, stills, sound, cover
        run: |
          cd "$PROJECT"
          python layout.py audio/vo_demo.wav audio/vo_demo_align.json
          python font.py fonts/fusion-pixel-12px-proportional-latin.bdf
          python render.py stills 0.5,3,6,9,12,14
          python render.py cues
          python mix.py
          python render.py cover cover.png
          test -s qa/st/sheet.jpg && test -s cover.png && test -s cover_grid.png && test -s audio/mix.wav
      - name: frames, final encode, QA
        run: |
          cd "$PROJECT"
          python render.py frames --workers 2
          python "$GITHUB_WORKSPACE/$SKILL/scripts/media.py" final frames audio/mix.wav out/demo.mp4
          python "$GITHUB_WORKSPACE/$SKILL/scripts/media.py" qa out/demo.mp4 --expect 18.5
          python "$GITHUB_WORKSPACE/$SKILL/scripts/media.py" cuts media/source.mp4
          python -c "import json; d = json.load(open('qa/cuts_source/cuts.json', encoding='utf-8')); assert any(abs(c - 4) < 0.1 for c in d['cuts']), d['cuts']"
      - name: align a spoken take (faster-whisper)
        if: runner.os == 'Linux'
        run: |
          pip install faster-whisper
          cd "$PROJECT"
          python -c "import json; ep = json.loads(open('episode.js', encoding='utf-8').read().split('=', 1)[1].strip().rstrip(';')); open('lines.txt', 'w', encoding='utf-8').write('\n\n'.join(ep['script']))"
          espeak-ng -s 155 -f lines.txt -w audio/tts.wav
          python "$GITHUB_WORKSPACE/$SKILL/scripts/media.py" wav audio/tts.wav audio/vo_tts.wav
          python align.py audio/vo_tts.wav --model tiny
          python layout.py audio/vo_tts.wav audio/vo_tts_align.json

  vibe-knowledge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SKILL: skills/vibe-knowledge
      VK_WS: ${{ github.workspace }}/../vk
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg-full -y --no-progress ;;
          esac
      - run: pip install numpy scipy pillow playwright rapidocr_onnxruntime
      - run: python -m playwright install chromium $([ "$RUNNER_OS" = Linux ] && echo --with-deps)
      - run: python -m compileall -q "$SKILL/scripts" "$SKILL/engine/tools" "$SKILL/engine/audio/tools"
      - run: python "$SKILL/scripts/doctor.py" --no-asr
      - name: demo episode (workspace, fonts, placeholder voice)
        run: python "$SKILL/scripts/demo.py" --no-optional-fonts
      - name: stills, full render, QA
        run: |
          python "$SKILL/scripts/render.py" stills demo "$VK_WS/sheet.png" 1 B01.ten+0.4 B02.fifty+0.6
          python "$SKILL/scripts/render.py" film demo --title demo
          python "$SKILL/scripts/qa.py" "$VK_WS/lessons/demo/build/lessondemo.mp4" | tee qa.txt
          test -s "$VK_WS/sheet.png" && test -s "$VK_WS/out/demo_demo.mp4" && test -s "$VK_WS/out/demo_demo.jpg"
          grep -q "有默认 BGM" qa.txt
          python -c "import json, sys; d = json.load(open(sys.argv[1], encoding='utf-8')); assert d['has_bgm'] and d['auto']" "$VK_WS/lessons/demo/build/bgm.json"
      - run: python "$SKILL/scripts/new_film.py" 01 --template B --title test --no-optional-fonts
      - run: python "$SKILL/scripts/duration.py" --scores 1,1,2,1,1 --template B
      - run: python "$SKILL/scripts/recommend.py" "商鞅立木为什么能让人相信新法"
      - name: voice take aligned with faster-whisper
        if: runner.os == 'Linux'
        env:
          WHISPER_MODEL: tiny
        run: |
          pip install faster-whisper
          printf '%s' '一根木头，赏十金，没人动。加到五十金，终于有人扛了。' > line.txt
          espeak-ng -v cmn -s 150 -f line.txt -w take.wav
          python "$SKILL/scripts/demo.py" --no-optional-fonts --take take.wav
          python "$SKILL/scripts/check_timings.py" demo
          python -c "import json, sys; t = json.load(open(sys.argv[1], encoding='utf-8')); b = t['beats']; assert t['total'] > 3 and b['B01']['start'] < b['B01']['cues']['ten'] < b['B02']['start'] < b['B02']['cues']['fifty']" "$VK_WS/lessons/demo/build/timings.json"
          python "$SKILL/scripts/render.py" stills demo "$VK_WS/sheet2.png" B02.fifty
